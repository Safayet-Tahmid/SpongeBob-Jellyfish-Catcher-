    <script>
      // Seamless static fallback for GitHub Pages branch root deployment:
      // If hosted on GitHub Pages directly from repository root where raw TSX cannot be compiled by static servers,
      // redirect automatically to the pre-built /docs/ directory which contains the complete production bundle.
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs/')) {
          var base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
          window.location.replace(base + 'docs/' + window.location.search + window.location.hash);
        }
      })();
    </script>
